<style>
:root{
  --bg:#050505; --ink:#f2efe8; --dim:#8d8a84; --red:#d8231f; --metal:#c9c6bf;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif;overflow:hidden}
.app{position:relative;width:393px;height:852px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (max-width:420px){.app{width:100vw;height:100dvh}}

/* status bar */
.status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:15px;font-weight:600}
.status .r{display:flex;gap:6px;align-items:center;font-size:12px}
.bat{width:24px;height:11px;border:1px solid var(--dim);border-radius:3px;position:relative}
.bat::after{content:"";position:absolute;inset:1px 5px 1px 1px;background:var(--ink);border-radius:1px}

/* top bar */
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.top .ic{width:34px;height:34px;display:grid;place-items:center;color:var(--ink)}
.top svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px rgba(216,35,31,.7)}
.ratio{font:500 12px var(--mono);letter-spacing:.08em;border:1px solid var(--dim);padding:5px 9px;border-radius:3px}

/* viewfinder 2:3 */
.vf{position:relative;width:100%;height:calc(393px*1.5);background:#000;overflow:hidden}
@media (max-width:420px){.vf{height:calc(100vw*1.5)}}
.scene{position:absolute;inset:0;width:100%;height:100%;transition:filter .3s}
.grain{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:overlay;opacity:.35;pointer-events:none}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45));pointer-events:none}
.grid{position:absolute;inset:0;background:
  linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.22) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.22) 66.6%,transparent 66.8%),
  linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.22) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.22) 66.6%,transparent 66.8%);pointer-events:none}
/* leica frame lines */
.frame{position:absolute;left:18px;right:18px;top:40px;bottom:150px;pointer-events:none}
.frame i{position:absolute;width:22px;height:22px;border:solid rgba(255,255,255,.9);border-width:0}
.frame i:nth-child(1){left:0;top:0;border-width:1.5px 0 0 1.5px}
.frame i:nth-child(2){right:0;top:0;border-width:1.5px 1.5px 0 0}
.frame i:nth-child(3){left:0;bottom:0;border-width:0 0 1.5px 1.5px}
.frame i:nth-child(4){right:0;bottom:0;border-width:0 1.5px 1.5px 0}
.focus{position:absolute;left:50%;top:46%;width:74px;height:74px;margin:-37px 0 0 -37px;border:1px solid rgba(255,255,255,.85);pointer-events:none}
.focus::before,.focus::after{content:"";position:absolute;background:var(--red)}
.focus::before{left:50%;top:-8px;width:1px;height:8px}
.focus::after{left:50%;bottom:-8px;width:1px;height:8px}

/* readout */
.readout{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:16px;padding:12px 0;font:500 11.5px var(--mono);letter-spacing:.06em;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.readout b{color:#ffd23f;font-weight:600}
body.shot .app{margin:0}

/* ── 실사용 UI 보강 ── */
body:not(.shot) .status > *{visibility:hidden}   /* 가짜 상태바는 스크린샷 전용 */
body:not(.shot) .home{display:none}
.bar{position:absolute;left:0;right:0;background:rgba(0,0,0,.82);pointer-events:none;z-index:2}
.toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:16px;background:rgba(0,0,0,.7);font:500 12px var(--mono);letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6;white-space:nowrap}
.toast.on{opacity:1}
.msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.72);text-align:center;font-size:14px;line-height:1.6;padding:0 40px;z-index:7}
.msg.on{display:flex}
.msg button,.gb button{font:600 13px var(--mono);letter-spacing:.1em;padding:10px 20px;border-radius:20px;border:1px solid #6b665c;background:#1b1a18;color:var(--ink)}
.shotflash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
.shotflash.on{opacity:1}
.countdown{position:absolute;inset:0;display:none;place-items:center;font:200 120px var(--mono);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:5;pointer-events:none}
.countdown.on{display:grid}
.top .ic[data-v]::after{content:attr(data-v);position:absolute;margin:30px 0 0 22px;font:700 8px var(--mono);color:#ffd23f}
.top .ic{position:relative}
.top .ic[data-v=""]::after{content:""}
.dial .mk{position:absolute;top:-7px;width:2px;height:26px;margin-left:-1px;background:var(--red);z-index:2}
.app .dial .ticks::after{display:none}
.thumb,.flip,.shutter,.ratio,.top .ic,.zoom span,.filters div{cursor:pointer}
.gallery{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
.gallery.on{display:flex}
.gh{display:flex;justify-content:space-between;align-items:center;padding:58px 22px 12px;font:600 14px var(--mono);letter-spacing:.12em}
#gclose{color:var(--dim)}
.gg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}
.gg img{width:100%;aspect-ratio:1;object-fit:cover}
.gg .empty{grid-column:1/-1;text-align:center;color:var(--dim);margin-top:80px;font-size:14px}
.gv{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding-top:40px}
.gv.on{display:flex}
.gv img{max-width:100%;max-height:70%}
.gb{display:flex;gap:10px}
.gb .del{color:#ff7b72}

/* ── 옛날 카메라 바디 (가죽·금속) ── */
.app{background:
  radial-gradient(circle at 30% 30%,rgba(255,255,255,.05) 0 1px,transparent 1.5px) 0 0/5px 5px,
  radial-gradient(circle at 70% 70%,rgba(0,0,0,.55) 0 1px,transparent 1.6px) 2px 2px/5px 5px,
  linear-gradient(#1a1a19,#0d0d0c)}
.app .vf{box-shadow:0 -1px 0 #4a4741,0 1px 0 #4a4741,0 -3px 0 #050505,0 3px 0 #050505}
.app .top .ic{width:36px;height:36px;border-radius:50%;color:#1b1a18;
  background:radial-gradient(circle at 35% 30%,#dedad0,#8f8b82 60%,#55524b);box-shadow:0 0 0 1.5px #0a0a0a,0 2px 3px rgba(0,0,0,.6)}
.app .top svg{width:18px;height:18px;stroke-width:1.6}
.app .ratio{color:#9b968b;border-color:#4a4741;text-shadow:0 1px 0 #000;letter-spacing:.16em}
.app .bottom{background:transparent}
.app .dial .ticks{background:repeating-linear-gradient(to right,#d4d0c6 0 2px,#5d5a53 2px 5px);height:12px;top:12px;border-radius:3px;box-shadow:0 0 0 1.5px #0a0a0a,0 2px 4px rgba(0,0,0,.6);opacity:1}
.app .dial .ticks::after{top:-7px;height:26px}
.app .dial .lab{color:#9b968b;letter-spacing:.1em;top:-10px}
.app .dial{height:30px;margin-bottom:14px}
.app .shutter{background:repeating-conic-gradient(#cfcbc1 0 4deg,#8a867d 4deg 8deg);padding:9px;box-shadow:0 0 0 2px #0a0a0a,0 4px 8px rgba(0,0,0,.7)}
.app .shutter b{background:radial-gradient(circle at 38% 32%,#f9f7f0,#bcb9b0 50%,#7a776f);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35),inset 0 -5px 8px rgba(0,0,0,.3);position:relative}
.app .shutter b::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--red)}
.app .shutter{width:84px;height:84px}
.app .thumb{box-shadow:0 0 0 2px #0a0a0a,0 0 0 3px #4a4741;border:0}
.app .flip{border:0;color:#1b1a18;background:radial-gradient(circle at 35% 30%,#dedad0,#8f8b82 60%,#55524b);box-shadow:0 0 0 1.5px #0a0a0a,0 2px 3px rgba(0,0,0,.6)}
/* level */
.level{position:absolute;left:50%;top:46%;width:150px;height:1px;margin-left:-75px;background:rgba(255,255,255,.0)}
.lvl{position:absolute;left:50%;bottom:132px;width:120px;margin-left:-60px;height:12px}
.lvl::before,.lvl::after{content:"";position:absolute;top:5px;height:1px;width:46px;background:rgba(255,255,255,.7)}
.lvl::before{left:0}.lvl::after{right:0}
.lvl em{position:absolute;left:50%;top:0;width:1px;height:11px;background:var(--red)}

/* overlay controls on viewfinder */
.zoom{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:center;gap:10px}
.zoom span{font:500 12px var(--mono);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:var(--ink)}
.zoom span.on{color:#ffd23f;border:1px solid rgba(255,210,63,.6)}
.filters{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:10px;overflow:hidden;padding:0 14px;justify-content:space-between}
.filters div{flex:1;text-align:center;font:500 9.5px var(--mono);letter-spacing:.04em;color:var(--dim);text-shadow:0 1px 2px #000}
.filters div i{display:block;margin:0 auto 5px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background-size:cover}
.filters div.on{color:var(--ink)}
.filters div.on i{border:1.5px solid var(--red);box-shadow:0 0 0 2px rgba(0,0,0,.5)}

/* bottom body */
.bottom{position:absolute;left:0;right:0;bottom:0;height:calc(852px - 47px - 52px - 393px*1.5);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(#0a0a0a,#000)}
@media (max-width:420px){.bottom{height:calc(100dvh - 99px - 100vw*1.5)}}
.dial{height:22px;position:relative;margin:0 40px 10px;color:var(--dim);font:10px var(--mono)}
.dial .ticks{position:absolute;left:0;right:0;top:10px;height:8px;background:repeating-linear-gradient(to right,var(--dim) 0 1px,transparent 1px 12px);opacity:.7}
.dial .ticks::after{content:"";position:absolute;left:50%;top:-6px;width:1.5px;height:14px;background:var(--red)}
.dial .lab{position:absolute;top:-4px;left:0;right:0;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;justify-content:space-between;padding:0 38px}
.thumb{width:46px;height:46px;border-radius:8px;border:1px solid #333;background:linear-gradient(160deg,#7fb0e6,#d9b98a 70%,#3b3025)}
.shutter{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fafaf7,#c5c2ba 45%,#7e7b74 100%);padding:5px;box-shadow:0 0 0 2px #1a1a1a,0 0 0 3px #555}
.shutter b{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f6f4ee,#b9b6ae);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -4px 8px rgba(0,0,0,.25)}
.flip{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid #333;color:var(--ink)}
.flip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.home{position:absolute;bottom:7px;left:50%;width:134px;height:5px;margin-left:-67px;background:var(--ink);border-radius:3px;opacity:.9}
video#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}

/* ═══ 레이아웃 v2: 실기기 폭 대응 + 가로 모드 + 필터 스크롤 ═══ */
:root{--st:max(47px,env(safe-area-inset-top,0px))}
.app{display:flex;flex-direction:column}
@media (max-width:900px){.app{width:100vw;height:100dvh;margin:0}}
.app .status{height:var(--st);flex:0 0 auto}
.app .top{flex:0 0 52px}
.app .vf{flex:0 1 calc(100vw*1.5);height:auto;min-height:0;width:100%}
.app .bottom{position:relative;flex:1 0 170px;height:auto;left:auto;right:auto;bottom:auto}
.app .frame{top:40px;bottom:96px}
/* 필터 스크롤 스트립 */
.app .filters{left:0;right:0;bottom:0;display:flex;gap:0;overflow-x:auto;overflow-y:hidden;padding:26px 27% 12px;justify-content:flex-start;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  background:linear-gradient(transparent,rgba(0,0,0,.62) 45%)}
.app .filters::-webkit-scrollbar{display:none}
.app .filters div{flex:0 0 var(--fw,180px);scroll-snap-align:center;text-align:center;padding:0 2px;opacity:.42;transition:opacity .2s;white-space:nowrap}
.app .filters div b{display:block;font:600 11.5px var(--mono);letter-spacing:.1em;color:var(--ink)}
.app .filters div em{display:block;font:400 10.5px -apple-system,"SF Pro Text",sans-serif;font-style:normal;color:#d9d4c7;margin-top:4px;min-height:14px;opacity:0;transition:opacity .2s}
.app .filters div.on{opacity:1}
.app .filters div.on em{opacity:1}
.fmark{position:absolute;left:50%;bottom:50px;width:1.5px;height:9px;margin-left:-.75px;background:var(--red);z-index:3;pointer-events:none}
.app .zoom{bottom:96px}
.gf{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000 40%);display:flex;justify-content:center}
.gf button{font:600 14px var(--mono);letter-spacing:.1em;padding:14px 28px;border-radius:26px;border:1px solid #8d8a84;background:#1b1a18;color:var(--ink);min-width:240px}
.gh{padding-top:calc(max(env(safe-area-inset-top,0px),44px) + 12px)}
#gclose{color:var(--ink);padding:8px 0 8px 16px}
.gg{padding-bottom:100px}
.gv{z-index:3}
.gv .gb{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}

/* ── 가로 모드 ── */
@media (orientation:landscape) and (max-height:600px){
  .app{flex-direction:row}
  .app .status{display:none}
  .app .top{order:1;flex:0 0 calc(104px + env(safe-area-inset-left,0px));height:auto;flex-direction:column;justify-content:space-evenly;align-items:center;padding:8px 0 8px env(safe-area-inset-left,0px)}
  .app .vf{order:2;flex:1 1 auto;width:auto;height:100%;min-width:0}
  .app .bottom{order:3;flex:0 0 calc(124px + env(safe-area-inset-right,0px));height:auto;min-height:0;padding:10px env(safe-area-inset-right,0px) 10px 0;align-items:center;justify-content:space-between}
  .app .row{flex-direction:column;gap:12px;padding:0}
  .app .dial{width:92px;margin:0;height:30px}
  .app .dial .lab{display:none}
  .app .frame{top:34px;bottom:78px;left:26px;right:26px}
  .app .lvl{bottom:96px}
  .app .zoom{left:auto;right:10px;bottom:auto;top:46%;transform:translateY(-50%);flex-direction:column;justify-content:flex-start}
  .app .filters{padding-top:18px;padding-bottom:6px}
  .fmark{bottom:42px}
  .toast{top:36px}
  .app .readout{padding:8px 0}
}
</style>

      <text x="262" y="256" font-size="15" font-weight="700" text-anchor="middle" fill="#222" font-family="Arial">50</text>
    </svg>
    <svg class="grain" id="grain" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
